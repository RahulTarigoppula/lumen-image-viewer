name: Dev check

# Fast feedback for work branches: every push to dev/** compiles the full app
# (FFmpeg video and AI included), runs clippy for hard errors and runs all unit
# tests. The release build with the dist profile stays in build.yml.
on:
  push:
    branches: ["dev/**"]
  workflow_dispatch:

env:
  VCPKG_COMMIT: bf19794383e8fb95eba5aa553235bc8ec2271688
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg-lumen
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
      VCPKGRS_TRIPLET: x64-windows-static-md-rel
    steps:
      - uses: actions/checkout@v4

      - name: Check UI text uses plain punctuation
        run: python tools/scrub_text.py --check src crates

      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg/**') }}-ffmpeg-x64-windows-static-md-rel

      - name: Install FFmpeg (static, LGPL) via vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_ROOT\vcpkg.exe" install "ffmpeg[core,avcodec,avformat,swscale,swresample,dav1d]:x64-windows-static-md-rel" --overlay-ports=vcpkg/overlay-ports --overlay-triplets=vcpkg/triplets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save vcpkg binaries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg/**') }}-ffmpeg-x64-windows-static-md-rel

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-dev-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-dev-

      - name: Locate libclang
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Unit tests (all crates, image features)
        run: cargo test --workspace --no-default-features

      - name: Unit tests (app with video and AI)
        run: cargo test -p lumen

      - name: Clippy (errors only)
        run: cargo clippy --workspace --all-targets -- -A clippy::all -D clippy::correctness

      - name: Build (debug, all features)
        run: cargo build

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-dev
          path: target/debug/lumen.exe
          retention-days: 3

  # UI smoke test: runs the debug build from the check job on Mesa's software
  # OpenGL (no GPU on hosted runners), drives tools/ui-smoke/scenarios through
  # the dev hook and uploads screenshots and logs as the `ui-smoke` artifact.
  ui-smoke:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MESA_VERSION: "26.1.8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lumen-dev
          path: ui-smoke-bin

      - name: Cache Mesa
        id: mesa-cache
        uses: actions/cache@v4
        with:
          path: mesa
          key: mesa-${{ env.MESA_VERSION }}-msvc-x64

      - name: Get Mesa llvmpipe OpenGL
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: tools/ui-smoke/get_mesa.ps1 -Dest mesa -Version $env:MESA_VERSION

      - name: Make test media
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q pillow numpy imageio-ffmpeg
          python tools/ui-smoke/make_media.py ui-smoke-media

      - name: Run UI smoke test
        shell: pwsh
        run: tools/ui-smoke/run.ps1 -Exe ui-smoke-bin/lumen.exe -Mesa mesa -Media ui-smoke-media -Out ui-smoke-out -SetResolution

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke
          path: ui-smoke-out
          retention-days: 7
