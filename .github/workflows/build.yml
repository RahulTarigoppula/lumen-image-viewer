name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_COMMIT: bf19794383e8fb95eba5aa553235bc8ec2271688
  CARGO_TERM_COLOR: always

jobs:
  quick-check:
    # Fast feedback without FFmpeg: unit tests and text checks for the image features.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-quick-${{ hashFiles('Cargo.lock') }}
      - name: Check UI text uses plain punctuation
        run: python tools/scrub_text.py --check src
      - name: Unit tests (image features)
        run: cargo test --no-default-features

  windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg-lumen
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
      VCPKGRS_TRIPLET: x64-windows-static-md-rel
    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg/**') }}-ffmpeg-x64-windows-static-md-rel

      - name: Install FFmpeg (static, LGPL) via vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_ROOT\vcpkg.exe" install "ffmpeg[core,avcodec,avformat,swscale,swresample,dav1d]:x64-windows-static-md-rel" --overlay-ports=vcpkg/overlay-ports --overlay-triplets=vcpkg/triplets

      - name: Save vcpkg binaries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg/**') }}-ffmpeg-x64-windows-static-md-rel

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Locate libclang
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Build release
        run: cargo build --profile dist

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\dist\lumen.exe dist\Lumen.exe
          Copy-Item LICENSE dist\
          Copy-Item THIRD-PARTY-NOTICES.md dist\
          Compress-Archive -Path dist\* -DestinationPath dist\Lumen-portable.zip
          Get-FileHash dist\Lumen.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  Lumen.exe" } | Out-File dist\SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen
          path: |
            dist/Lumen.exe
            dist/Lumen-portable.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Lumen.exe
            dist/Lumen-portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
