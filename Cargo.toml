[workspace]
members = [".", "crates/lumen-core", "crates/lumen-analysis"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "MIT"
authors = ["Rahul Tarigoppula"]
repository = "https://github.com/RahulTarigoppula/lumen-image-viewer"

# Versions shared by more than one crate. Crate-specific dependencies stay in
# that crate's manifest.
[workspace.dependencies]
lumen-core = { path = "crates/lumen-core" }
lumen-analysis = { path = "crates/lumen-analysis" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "tga", "pnm", "hdr", "exr", "qoi", "dds", "ff", "rayon"] }
rayon = "1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
parking_lot = "0.12"
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
jpeg-encoder = "0.7.1"
webp = { version = "0.3", default-features = false }
ab_glyph = "0.2"
tiff = "0.11"
# Features are chosen per crate.
windows = "0.62"

# The app: UI, viewer, browser, batch tools and the FFmpeg video engine.
[package]
name = "lumen"
version.workspace = true
edition.workspace = true
description = "Lumen: a fast, private, modern image viewer, browser, editor and converter for Windows"
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
lumen-core.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = { version = "0.37", features = ["bytemuck"] }
egui_extras = { version = "0.37", features = ["image"] }
image.workspace = true
rayon.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
parking_lot.workspace = true
anyhow.workspace = true
log.workspace = true
chrono.workspace = true
jpeg-encoder.workspace = true
webp.workspace = true
ab_glyph.workspace = true
tiff.workspace = true
rfd = "0.17"
trash = "5"
arboard = { version = "3", features = ["image-data"] }
lru = "0.18"
ffmpeg-next = { version = "=9.0.0", optional = true, default-features = false, features = ["codec", "format", "software-scaling", "software-resampling", "static"] }
ffmpeg-sys-next = { version = "=9.0.1", optional = true, default-features = false, features = ["avcodec", "avformat", "swscale", "swresample", "static"] }
cpal = { version = "0.18", optional = true }
bytemuck = "1.25.2"
libwebp-sys = "0.9"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_IO",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_Xps",
    "Win32_System_DataExchange",
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Foundation",
]

[features]
default = ["video"]
video = ["dep:ffmpeg-next", "dep:ffmpeg-sys-next", "dep:cpal"]

[build-dependencies]
winresource = "0.1"

# Profiles apply to the whole workspace and must live in the root manifest.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
panic = "unwind"
strip = true
debug = false

# Published binaries: slower to build, smallest and fastest exe.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
